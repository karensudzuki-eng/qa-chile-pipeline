name: QA Chile Pipeline E2E
on:
  repository_dispatch:
    types: [run-qa-test]

jobs:
  automation-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo de GitHub
        uses: actions/checkout@v4

      - name: Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias del proyecto
        run: npm install

      # Sintaxis oficial del CLI: descarga Chromium y las dependencias de Linux del sistema
      - name: Instalar Navegador y Dependencias de Playwright
        run: npx playwright install chromium --with-deps

      - name: Ejecutar simulacion en caliente
        env:
          TARGET_URL: ${{ github.event.client_payload.target_url }}
        run: node simulacion.js
