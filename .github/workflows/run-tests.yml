name: QA Chile Pipeline E2E
on:
  repository_dispatch:
    types: [run-qa-test]

jobs:
  automation-test:
    runs-on: ubuntu-latest
    # Levantamos el contenedor oficial de Microsoft con todo listo de fabrica
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - name: Descargar codigo de GitHub
        uses: actions/checkout@v4

      - name: Instalar dependencias del proyecto
        run: npm install

      # Ya no necesitamos el comando "playwright install" porque el contenedor ya viene con Chromium listo!
      - name: Ejecutar simulacion en caliente
        env:
          TARGET_URL: ${{ github.event.client_payload.ecommerce_url || github.event.client_payload.target_url }}
          TRACKING_CODE: ${{ github.event.client_payload.tracking_code }}
          CONTACT_EMAIL: ${{ github.event.client_payload.contact_email }}
        run: node simulacion.js

      - name: Despachar reporte final por correo
        if: always() # Garantiza el envío tanto si las pruebas pasaron como si fallaron
        run: |
          curl -s -X POST https://qachile.cl/api/send-report \
            -H "Content-Type: application/json" \
            -d '{
              "tracking_code": "${{ github.event.client_payload.tracking_code }}",
              "ecommerce_url": "${{ github.event.client_payload.ecommerce_url || github.event.client_payload.target_url }}",
              "contact_email": "${{ github.event.client_payload.contact_email }}",
              "status": "${{ job.status }}"
            }'
